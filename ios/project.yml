name: Motuo
options:
  bundleIdPrefix: cn.yundongyl
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 7NUGZ3A48C
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "3"
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  Motuo:
    type: application
    platform: iOS
    sources:
      - path: Motuo
        excludes: [Resources/Cockpit, Cockpit/native-runtime.js, Cockpit/native-runtime.css, Cockpit/v3]
      - path: Shared
      - path: Motuo/Resources/Cockpit
        type: folder
        buildPhase: resources
    info:
      path: Motuo/Info.plist
      properties:
        CFBundleDisplayName: MOTUO
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSLocationWhenInUseUsageDescription: 记录骑行路线、速度并提供导航；仅在你开始骑行后采集。
        NSLocationAlwaysAndWhenInUseUsageDescription: 在锁屏或切换应用后继续记录你开启的骑行。
        NSMicrophoneUsageDescription: 在你开启后用手机麦克风感受外界声浪，驱动仪表动效；仅本机分析，不保存或上传原音。
        NSMotionUsageDescription: 感知手机支架上的加速度与转动，生成骑行动态与复盘。
        NSAppleMusicUsageDescription: 访问你授权的 Apple Music 音乐，在骑行时播放。
        NSBluetoothAlwaysUsageDescription: 连接你选择的胎压、HUD 与动态传感器配件。
        NSLocalNetworkUsageDescription: 连接你选择的 Wi-Fi HUD 与摩托配件。
        NSBonjourServices: ["_motuo-hud._tcp"]
        UIBackgroundModes: [location, audio, bluetooth-central]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.yundongyl.motuo
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: iPhone Distribution
          PROVISIONING_PROFILE_SPECIFIER: Motuo App Store
    dependencies:
      - target: MotuoWatch
  MotuoWatch:
    type: application
    platform: watchOS
    sources: [MotuoWatch, Shared]
    info:
      path: MotuoWatch/Info.plist
      properties:
        CFBundleDisplayName: MOTUO
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKCompanionAppBundleIdentifier: cn.yundongyl.motuo
        WKApplication: true
        WKWatchOnly: false
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.yundongyl.motuo.watchkitapp
        SDKROOT: watchos
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: iPhone Distribution
          PROVISIONING_PROFILE_SPECIFIER: Motuo Watch App Store
  MotuoTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MotuoTests]
    dependencies:
      - target: Motuo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.yundongyl.motuo.tests
        GENERATE_INFOPLIST_FILE: true
  MotuoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [MotuoUITests]
    dependencies:
      - target: Motuo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.yundongyl.motuo.uitests
        GENERATE_INFOPLIST_FILE: true
schemes:
  Motuo:
    build:
      targets:
        Motuo: all
        MotuoWatch: all
    test:
      targets: [MotuoTests, MotuoUITests]
