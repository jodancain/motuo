# BEGIN motuo-yundongyl
limit_req_zone $binary_remote_addr zone=motuo_pair:1m rate=6r/m;
limit_req_zone $binary_remote_addr zone=motuo_api:1m rate=20r/s;
server {
    listen 80;
    server_name motuo.yundongyl.cn;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name motuo.yundongyl.cn;
    ssl_certificate /etc/letsencrypt/live/motuo.yundongyl.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/motuo.yundongyl.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 4m;
    client_body_timeout 120s;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location = /v1/pair {
        limit_req zone=motuo_pair burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://100.74.46.95:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /v1/ {
        limit_req zone=motuo_api burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://100.74.46.95:3020;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
        proxy_cache off;
    }
    location = /healthz {
        proxy_pass http://100.74.46.95:3020;
        proxy_read_timeout 10s;
    }
    location = / {
        default_type text/plain;
        return 200 "MOTUO — Private motorcycle companion. iOS / watchOS.\n";
    }
    location / { return 404; }
}
# END motuo-yundongyl
