# BEGIN motuo-yundongyl
server {
    listen 80;
    server_name motuo.yundongyl.cn;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / {
        default_type application/json;
        add_header Retry-After 3600 always;
        return 503 '{"service":"motuo","status":"https_pending"}';
    }
}
# END motuo-yundongyl
